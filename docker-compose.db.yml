services:
  db:
    image: mariadb:11.2
    container_name: ea_tracker_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: CoopBank2025!
      MARIADB_DATABASE: ea_task_tracker
      MARIADB_USER: ea_user
      MARIADB_PASSWORD: CoopBank2025!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ea_network
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 5 bash -c '</dev/tcp/127.0.0.1/3306'"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 15s

volumes:
  mysql_data:
    name: ea_tracker_mysql_data

networks:
  ea_network:
    name: ea_network
    driver: bridge