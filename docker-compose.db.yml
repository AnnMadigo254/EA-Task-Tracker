services:
  db:
    image: mariadb:11.2
    container_name: ea_tracker_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: CoopBank2025!
      MARIADB_DATABASE: ea_task_tracker
      MARIADB_USER: ea_user
      MARIADB_PASSWORD: CoopBank2025!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ea_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10
      interval: 5s

volumes:
  mysql_data:
    name: ea_tracker_mysql_data

networks:
  ea_network:
    name: ea_network
    driver: bridge